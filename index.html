<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#15803D">
<title>Dashboard Web — SAMAQU Keyboard</title>
<style>
  /* ---------------------------------------------------------------- tokens */
  :root{
    --brand:#15803D; --brand-dark:#166534; --brand-ink:#15803D; --brand-soft:#E6F4EA;
    --bg:#F4F7F5; --card:#FFFFFF; --text:#14201A; --muted:#5E6F65;
    --line:#E3EAE5; --field:#FFFFFF; --hover:#F0F5F2; --danger:#DC2626; --danger-soft:#FEF0F0;
    --shadow:0 1px 2px rgba(12,32,20,.04), 0 8px 24px rgba(12,32,20,.05);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --brand:#16A34A; --brand-dark:#15803D; --brand-ink:#4ADE80; --brand-soft:#15291D;
      --bg:#0C120F; --card:#131B16; --text:#E7F0EA; --muted:#9DB0A3;
      --line:#23302A; --field:#18221C; --hover:#1A251E; --danger:#F87171; --danger-soft:#3A1F27;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------------------------------------------------------------- top bar */
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:14px 16px; padding-top:max(14px, env(safe-area-inset-top));
  }
  .top{max-width:1120px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .logo{
    flex:0 0 auto; width:40px; height:40px; border-radius:12px; color:#fff;
    display:grid; place-items:center; background:linear-gradient(135deg,#16A34A,#14532D);
  }
  header h1{margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em}
  header p{margin:2px 0 0; font-size:13px; color:var(--muted)}
  @media (min-width:900px){
    header{padding:16px 24px}
    header h1{font-size:18px}
  }

  /* ---------------------------------------------------------------- layout */
  .layout{
    max-width:1120px; margin:0 auto; padding:16px 14px 72px;
    padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right));
    display:grid; gap:14px; grid-template-columns:minmax(0,1fr);
  }
  @media (min-width:900px){
    .layout{grid-template-columns:290px minmax(0,1fr); gap:24px; padding:28px 24px 80px; align-items:start}
    .side{position:sticky; top:20px}
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  @media (min-width:900px){ .card{padding:20px} }
  .side-head,.pane-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .side-head{margin-bottom:12px}
  .card h2{margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700}
  .pane-head{margin-bottom:14px}
  #tplTitle{font-size:20px; text-transform:none; letter-spacing:-.015em; color:var(--text); font-weight:700; line-height:1.2}
  .sub{margin:3px 0 0; font-size:13px; color:var(--muted)}

  /* ---------------------------------------------------------------- category list */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin:0 -2px;
    scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; scroll-snap-align:start;
    border:1px solid var(--line); background:transparent; color:var(--text);
    border-radius:999px; padding:8px 14px; font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;
    transition:background .15s, border-color .15s, color .15s;
  }
  .chip .count{font-size:12px; font-weight:600; color:var(--muted)}
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--brand-soft); border-color:var(--brand-ink); color:var(--brand-ink); font-weight:600}
  .chip.on .count{color:var(--brand-ink)}
  @media (min-width:900px){
    .chips{flex-direction:column; overflow:visible; padding:0; margin:0; gap:2px}
    .chip{
      width:100%; justify-content:space-between; border:0; border-radius:10px; padding:10px 12px;
      text-align:left; position:relative;
    }
    .chip .name{overflow:hidden; text-overflow:ellipsis}
    .chip.on::before{
      content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:3px; background:var(--brand-ink);
    }
  }
  .cat-actions{display:flex; gap:4px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}

  /* ---------------------------------------------------------------- buttons */
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  button{
    font:inherit; font-size:14px; font-weight:600; cursor:pointer; min-height:40px;
    border-radius:10px; padding:9px 16px; border:1px solid transparent;
    transition:background .15s, border-color .15s, opacity .15s, color .15s, transform .1s;
  }
  button:active:not(:disabled){transform:scale(.98)}
  button:focus-visible,.chip:focus-visible{outline:2px solid var(--brand-ink); outline-offset:2px}
  .btn{background:var(--brand); color:#fff}
  .btn:hover:not(:disabled){background:var(--brand-dark)}
  .btn.ghost{background:transparent; color:var(--brand-ink); border-color:var(--line)}
  .btn.ghost:hover:not(:disabled){background:var(--hover); border-color:var(--brand-ink)}
  .btn.good{background:var(--brand); color:#fff}
  .btn.good:hover:not(:disabled){background:var(--brand-dark)}
  .btn.sub{background:transparent; color:var(--muted); border-color:var(--line)}
  .btn.sub:hover:not(:disabled){border-color:var(--muted); color:var(--text)}
  .btn.small{min-height:34px; padding:6px 12px; font-size:13px}
  .link{background:none; border:0; min-height:36px; padding:6px 10px; font-size:13px; color:var(--muted); border-radius:8px}
  .link:hover:not(:disabled){background:var(--hover); color:var(--text)}
  .link.bad:hover:not(:disabled){background:var(--danger-soft); color:var(--danger)}
  button:disabled{opacity:.45; cursor:not-allowed}

  /* ---------------------------------------------------------------- fields */
  textarea,input{
    font:inherit; font-size:16px; width:100%; color:var(--text); background:var(--field);
    border:1px solid var(--line); border-radius:11px; padding:11px 13px;
  }
  textarea{min-height:96px; resize:vertical; line-height:1.55}
  textarea::placeholder,input::placeholder{color:var(--muted); opacity:.8}
  textarea:focus,input:focus{outline:2px solid var(--brand-ink); outline-offset:-1px; border-color:var(--brand-ink)}
  #formCat{display:none; margin-top:12px}

  /* "new template" form: closed until asked for, closes again after saving */
  #formTpl{
    background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:16px;
  }
  #formTpl .row{margin-top:10px}
  .hint{color:var(--muted); font-size:13px; margin:8px 2px 0}

  /* ---------------------------------------------------------------- templates (read-only cards) */
  #tplList{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
  @media (min-width:1180px){ #tplList{grid-template-columns:repeat(2, minmax(0,1fr))} }
  .tpl{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 14px 16px 16px; transition:border-color .15s, box-shadow .15s;
  }
  .tpl:hover{border-color:color-mix(in srgb, var(--brand-ink) 45%, var(--line))}
  .tpl .txt{
    white-space:pre-wrap; word-break:break-word; font-size:15px; margin:0; padding-right:70px; cursor:default;
  }
  .tpl .acts{position:absolute; top:8px; right:8px; display:flex; gap:2px}
  .icon-btn{
    width:34px; height:34px; min-height:0; padding:0; display:grid; place-items:center;
    background:none; border:0; border-radius:9px; color:var(--muted);
  }
  .icon-btn:hover{background:var(--hover); color:var(--text)}
  .icon-btn.e:hover{color:var(--brand-ink)}
  .icon-btn.d:hover{background:var(--danger-soft); color:var(--danger)}
  .tpl.editing{border-color:var(--brand-ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand-ink) 18%, transparent)}
  .tpl.editing form{margin:0}
  .tpl.editing .row{margin-top:10px}

  .empty{
    grid-column:1/-1; color:var(--muted); font-size:14px; text-align:center; padding:34px 12px;
    border:1px dashed var(--line); border-radius:14px;
  }
  .chips .empty{border:0; padding:6px 0; text-align:left}

  /* ---------------------------------------------------------------- feedback */
  #toast{
    position:fixed; left:50%; bottom:max(22px, env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:#0F172A; color:#fff; padding:12px 20px; border-radius:999px;
    font-size:14px; opacity:0; pointer-events:none; transition:.25s; max-width:92vw;
    text-align:center; z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger); color:#fff}
  #busy{position:fixed; top:0; left:0; height:3px; background:var(--brand-ink); width:0; transition:width .3s; z-index:60}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<div id="busy"></div>

<header>
  <div class="top">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10.5 10h.01M14.5 10h.01M17.5 10h.01M7.5 14h9"/></svg>
    </div>
    <div>
      <h1>Dashboard Web — SAMAQU Keyboard</h1>
      <p>Kelola template chat &amp; kategori. Perubahan langsung tersimpan ke Supabase, langsung kepakai di keyboard.</p>
    </div>
  </div>
</header>

<main class="layout">
  <section class="card side" aria-label="Kategori">
    <div class="side-head">
      <h2>Kategori</h2>
      <button class="btn ghost small" id="btnAddCat">+ Tambah</button>
    </div>
    <div class="chips" id="chips"></div>

    <form class="row" id="formCat" novalidate>
      <input id="catName" placeholder="Nama kategori" autocomplete="off" style="flex:1 1 200px">
      <button class="btn" type="submit">Simpan</button>
      <button class="btn sub" type="button" id="catCancel">Batal</button>
    </form>

    <div class="cat-actions" id="catActions">
      <button class="link" id="btnRename">Ubah nama</button>
      <button class="link bad" id="btnDeleteCat">Hapus kategori</button>
    </div>
  </section>

  <section class="card pane" aria-label="Template">
    <div class="pane-head">
      <div>
        <h2 id="tplTitle">Template</h2>
        <p class="sub" id="tplCount"></p>
      </div>
      <button class="btn" id="btnNewTpl">+ Template</button>
    </div>

    <form id="formTpl" novalidate style="display:none">
      <textarea id="tplText" placeholder="Tulis teks template… (bisa pakai emoji)"></textarea>
      <div class="row">
        <button class="btn good" type="submit" id="btnSaveTpl">Simpan Template</button>
        <button class="btn sub" type="button" id="btnCancelEdit">Batal</button>
      </div>
      <p class="hint" id="tplHint">Template baru ditambahkan ke kategori yang sedang dipilih. Ctrl+Enter untuk menyimpan.</p>
    </form>

    <div id="tplList"></div>
  </section>
</main>

<div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Same project, same origin: this page is served from <ref>.supabase.co/storage
// and talks to <ref>.supabase.co/rest, so the browser sees one origin and no
// CORS preflight is needed. The anon key is public by design; Row Level
// Security still decides what it may touch (categories + templates only).
// ---------------------------------------------------------------------------
const SUPABASE_URL = "https://bzoitgivmozhwpuomuhj.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6b2l0Z2l2bW96aHdwdW9tdWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTI3MTEsImV4cCI6MjEwODI4ODcxMX0.oaeio-kSZPtXhh1w24rFmlQw44DVg9b02wPujY6oAhk";

const CAT_SELECT =
  "id,name,display_order,templates(id,content,display_order)";

let cats = [];
let selectedId = null;
let editingId = null;      // template being edited in place, null = every card is read-only
let composerOpen = false;  // the "new template" form stays closed until it is asked for
let catMode = null;        // "add" | "rename" | null

const $ = (id) => document.getElementById(id);

const ICON_EDIT = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

// ------------------------------------------------------------------ transport
async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      apikey: ANON_KEY,
      Authorization: "Bearer " + ANON_KEY,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (_) { /* non-JSON body */ } }
  if (!res.ok) {
    throw new Error((data && data.message) || ("HTTP " + res.status));
  }
  return data;
}

function busy(on) { $("busy").style.width = on ? "100%" : "0"; }

let toastTimer = null;
function toast(message, isError) {
  const el = $("toast");
  el.textContent = message;
  el.classList.toggle("err", !!isError);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

/**
 * Runs a mutation and paints the result from what the request already told us.
 *
 * Every save used to be followed by load() - a second full round trip just to display data
 * the write had already confirmed. On the slow links this page is used on, that second
 * request was most of the waiting. The server stays the source of truth: only the row it
 * sends back is applied, and a failure still falls back to a full read so the screen can
 * never drift away from Supabase.
 */
async function mutate(successText, run) {
  busy(true);
  try {
    await run();
    render();
    toast(successText);
    return true;
  } catch (err) {
    toast("Gagal: " + err.message, true);
    try { await load(); } catch (_) { /* keep the toast that explains the real failure */ }
    return false;
  } finally {
    busy(false);
  }
}

// -------------------------------------------------------------------- loading
async function load() {
  busy(true);
  try {
    cats = (await api("/rest/v1/categories?select=" + CAT_SELECT +
      "&order=display_order.asc,id.asc")) || [];
    cats.forEach(c => (c.templates || []).sort(
      (a, b) => (a.display_order - b.display_order) || (a.id - b.id)));
    if (!cats.some(c => c.id === selectedId)) {
      selectedId = cats.length ? cats[0].id : null;
    }
    render();
  } catch (err) {
    toast("Gagal memuat: " + err.message, true);
  } finally {
    busy(false);
  }
}

const current = () => cats.find(c => c.id === selectedId) || null;

// ------------------------------------------------------------------- rendering
function render() {
  renderChips();
  renderTemplates();
  const has = !!current();
  $("btnRename").disabled = !has;
  $("btnDeleteCat").disabled = !has;
  $("btnAddCat").disabled = catMode === "add";
  if (catMode !== "rename") $("catName").value = "";
}

function renderChips() {
  const wrap = $("chips");
  wrap.textContent = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c.id === selectedId ? " on" : "");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = c.name;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = c.templates ? c.templates.length : 0;
    b.append(name, count);
    b.onclick = () => {
      selectedId = c.id;
      editingId = null;
      closeComposer(false);
      closeCatForm();
      render();
    };
    wrap.appendChild(b);
  });
  if (!cats.length) {
    const s = document.createElement("span");
    s.className = "empty";
    s.textContent = "Belum ada kategori — tekan “+ Tambah”.";
    s.style.padding = "6px 0";
    wrap.appendChild(s);
  }
}

function renderTemplates() {
  const list = $("tplList");
  list.textContent = "";
  const cat = current();
  $("btnNewTpl").disabled = !cat;

  if (!cat) {
    $("tplTitle").textContent = "Template";
    $("tplCount").textContent = "";
    $("formTpl").style.display = "none";
    list.innerHTML = '<div class="empty">Pilih atau buat kategori dulu.</div>';
    return;
  }

  $("tplTitle").textContent = cat.name;
  const n = (cat.templates || []).length;
  $("tplCount").textContent = n + " template";
  $("formTpl").style.display = composerOpen ? "" : "none";

  if (!n) {
    list.innerHTML = '<div class="empty">Belum ada template di kategori ini.</div>';
    return;
  }

  cat.templates.forEach(t => {
    const card = document.createElement("article");
    card.className = "tpl";
    if (t.id === editingId) {
      card.classList.add("editing");
      card.appendChild(inlineEditor(t, cat));
    } else {
      card.appendChild(readOnlyView(t));
    }
    list.appendChild(card);
  });
}

/** A template as plain text: nothing here can be typed into. */
function readOnlyView(t) {
  const frag = document.createDocumentFragment();

  const p = document.createElement("p");
  p.className = "txt";
  p.textContent = t.content;

  const acts = document.createElement("div");
  acts.className = "acts";

  const edit = document.createElement("button");
  edit.className = "icon-btn e";
  edit.title = "Ubah";
  edit.setAttribute("aria-label", "Ubah template");
  edit.innerHTML = ICON_EDIT;
  edit.onclick = () => {
    editingId = t.id;
    closeComposer(false);
    renderTemplates();
  };

  const del = document.createElement("button");
  del.className = "icon-btn d";
  del.title = "Hapus";
  del.setAttribute("aria-label", "Hapus template");
  del.innerHTML = ICON_TRASH;
  del.onclick = () => {
    if (!confirm("Hapus template ini dari Supabase?")) return;
    const target = t.id;
    mutate("Template terhapus ✓", async () => {
      await api("/rest/v1/templates?id=eq." + target, { method: "DELETE" });
      const c = current();
      if (c) c.templates = (c.templates || []).filter(x => x.id !== target);
    });
  };

  acts.appendChild(edit);
  acts.appendChild(del);
  frag.appendChild(p);
  frag.appendChild(acts);
  return frag;
}

/** The card of the template being edited: a textarea with Simpan / Batal, in place. */
function inlineEditor(t, cat) {
  const form = document.createElement("form");
  form.noValidate = true;

  const ta = document.createElement("textarea");
  ta.value = t.content;
  ta.setAttribute("aria-label", "Teks template");

  const row = document.createElement("div");
  row.className = "row";

  const save = document.createElement("button");
  save.type = "submit";
  save.className = "btn good";
  save.textContent = "Simpan Perubahan";

  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.className = "btn sub";
  cancel.textContent = "Batal";
  cancel.onclick = () => { editingId = null; renderTemplates(); };

  row.appendChild(save);
  row.appendChild(cancel);
  form.appendChild(ta);
  form.appendChild(row);

  ta.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); form.requestSubmit(); }
  });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const content = ta.value.trim();
    if (!content) { toast("Teks template tidak boleh kosong", true); return; }
    const target = t.id;
    await mutate("Template diubah ✓", async () => {
      await api("/rest/v1/templates?id=eq." + target, {
        method: "PATCH", body: JSON.stringify({ content })
      });
      const x = (cat.templates || []).find(y => y.id === target);
      if (x) x.content = content;
      editingId = null;   // only once the server accepted it; a failure keeps the editor open
    });
  };

  requestAnimationFrame(() => {
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  });
  return form;
}

function closeCatForm() {
  catMode = null;
  $("formCat").style.display = "none";
  $("catName").value = "";
  render();
}

function openComposer() {
  editingId = null;
  composerOpen = true;
  renderTemplates();
  $("tplText").focus();
}

function closeComposer(repaint = true) {
  composerOpen = false;
  $("tplText").value = "";
  $("formTpl").style.display = "none";
  if (repaint) renderTemplates();
}

// ------------------------------------------------------------------ mutations
function nextOrder(list) {
  return list.reduce((max, x) => Math.max(max, x.display_order || 0), 0) + 1;
}

$("btnAddCat").onclick = () => {
  catMode = "add";
  $("formCat").style.display = "flex";
  $("catName").placeholder = "Nama kategori baru";
  $("catName").value = "";
  $("catName").focus();
  render();
};

$("btnRename").onclick = () => {
  const cat = current();
  if (!cat) return;
  catMode = "rename";
  $("formCat").style.display = "flex";
  $("catName").placeholder = "Nama kategori";
  $("catName").value = cat.name;
  $("catName").focus();
  $("catName").select();
};

$("catCancel").onclick = closeCatForm;

$("formCat").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("catName").value.trim();
  if (!name) { toast("Nama tidak boleh kosong", true); return; }

  if (catMode === "rename") {
    const cat = current();
    if (!cat) return;
    const ok = await mutate("Kategori diubah ✓", async () => {
      await api("/rest/v1/categories?id=eq." + cat.id, {
        method: "PATCH", body: JSON.stringify({ name })
      });
      cat.name = name;
    });
    if (ok) closeCatForm();
  } else {
    const ok = await mutate("Kategori ditambah ✓", async () => {
      const rows = await api("/rest/v1/categories", {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({ name, display_order: nextOrder(cats) })
      });
      // No row back means the id is unknown, so fall back to a read rather than invent one.
      if (!rows || !rows.length) { await load(); return; }
      cats.push({ ...rows[0], templates: [] });
    });
    if (ok) closeCatForm();
  }
};

$("btnDeleteCat").onclick = () => {
  const cat = current();
  if (!cat) return;
  const n = cat.templates ? cat.templates.length : 0;
  const msg = n
    ? "Hapus kategori “" + cat.name + "” beserta " + n + " template di dalamnya?"
    : "Hapus kategori “" + cat.name + "”?";
  if (!confirm(msg)) return;
  mutate("Kategori terhapus ✓", async () => {
    await api("/rest/v1/categories?id=eq." + cat.id, { method: "DELETE" });
    cats = cats.filter(c => c.id !== cat.id);
    selectedId = cats.length ? cats[0].id : null;
    editingId = null;
    composerOpen = false;
  });
};

$("btnNewTpl").onclick = openComposer;
$("btnCancelEdit").onclick = () => closeComposer();

$("tplText").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); $("formTpl").requestSubmit(); }
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (composerOpen) closeComposer();
  else if (editingId !== null) { editingId = null; renderTemplates(); }
});

$("formTpl").onsubmit = async (e) => {
  e.preventDefault();
  const content = $("tplText").value.trim();
  if (!content) { toast("Teks template tidak boleh kosong", true); return; }
  const cat = current();
  if (!cat) { toast("Pilih kategori dulu", true); return; }

  const ok = await mutate("Template ditambah ✓", async () => {
    const rows = await api("/rest/v1/templates", {
      method: "POST",
      headers: { Prefer: "return=representation" },
      body: JSON.stringify({
        category_id: cat.id,
        content,
        display_order: nextOrder(cat.templates || [])
      })
    });
    if (!rows || !rows.length) { await load(); return; }
    cat.templates = (cat.templates || []).concat(rows[0]);
  });
  if (ok) closeComposer();   // saved: the form goes away again instead of staying open
};

load();
</script>
</body>
</html>
