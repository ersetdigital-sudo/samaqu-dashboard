<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Web — SAMAQU Keyboard</title>
<style>
  :root{
    --brand:#7C3AED; --brand-dark:#5B21B6; --accent:#16A34A;
    --bg:#F5F6FA; --card:#FFFFFF; --text:#1E293B; --muted:#64748B;
    --line:#E2E8F0; --danger:#DC2626;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  header{
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#fff; padding:22px 16px;
  }
  header h1{margin:0; font-size:19px; font-weight:700}
  header p{margin:6px 0 0; font-size:13px; opacity:.85}
  main{max-width:680px; margin:0 auto; padding:16px 14px 48px}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-top:14px;
  }
  .card h2{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}

  /* category chips */
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:#F8FAFC; color:var(--text);
    border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .chip.on{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600}

  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  button{
    font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    border-radius:9px; padding:9px 14px; border:1px solid transparent;
  }
  .btn{background:var(--brand); color:#fff}
  .btn:hover{background:var(--brand-dark)}
  .btn.ghost{background:#fff; color:var(--brand); border-color:var(--brand)}
  .btn.good{background:var(--accent); color:#fff}
  .btn.bad{background:#fff; color:var(--danger); border-color:var(--danger)}
  .btn.sub{background:#fff; color:var(--muted); border-color:var(--line)}
  button:disabled{opacity:.5; cursor:not-allowed}

  textarea,input{
    font:inherit; width:100%; color:var(--text); background:#fff;
    border:1px solid var(--line); border-radius:9px; padding:10px 12px;
  }
  textarea{min-height:90px; resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--brand); outline-offset:-1px; border-color:var(--brand)}

  .tpl{
    background:#fff; border:1px solid var(--line); border-radius:11px;
    padding:12px 12px 6px; margin-bottom:9px;
  }
  .tpl .txt{white-space:pre-wrap; word-break:break-word; font-size:14px; margin:0 0 4px}
  .tpl .acts{display:flex; justify-content:flex-end; gap:4px}
  .tpl .acts button{background:none; border:0; padding:8px 10px; font-size:13px}
  .acts .e{color:var(--brand)} .acts .d{color:var(--danger)}

  .empty{color:var(--muted); font-size:14px; text-align:center; padding:26px 10px}
  .hint{color:var(--muted); font-size:12.5px; margin:8px 0 0}

  #formCat{display:none; margin-top:10px}
  #toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:#0F172A; color:#fff; padding:11px 18px; border-radius:999px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:.25s; max-width:92vw;
    text-align:center; z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger)}
  #busy{position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; transition:width .3s; z-index:60}
</style>
</head>
<body>

<div id="busy"></div>

<header>
  <h1>Dashboard Web — SAMAQU Keyboard</h1>
  <p>Kelola template chat &amp; kategori. Perubahan langsung tersimpan ke Supabase, langsung kepakai di keyboard.</p>
</header>

<main>
  <div class="card">
    <h2>Kategori</h2>
    <div class="chips" id="chips"></div>

    <div class="row" id="catActions">
      <button class="btn ghost" id="btnRename">Ubah Nama</button>
      <button class="btn bad" id="btnDeleteCat">Hapus Kategori</button>
      <button class="btn sub" id="btnAddCat">+ Tambah Kategori</button>
    </div>

    <form class="row" id="formCat" novalidate>
      <input id="catName" placeholder="Nama kategori" autocomplete="off" style="flex:1 1 200px">
      <button class="btn" type="submit">Simpan</button>
      <button class="btn sub" type="button" id="catCancel">Batal</button>
    </form>
  </div>

  <div class="card">
    <h2 id="tplTitle">Template</h2>
    <div id="tplList"></div>

    <form id="formTpl" novalidate>
      <textarea id="tplText" placeholder="Tulis teks template… (bisa pakai emoji)"></textarea>
      <div class="row">
        <button class="btn good" type="submit" id="btnSaveTpl">Simpan Template</button>
        <button class="btn sub" type="button" id="btnCancelEdit" style="display:none">Batal Ubah</button>
      </div>
    </form>
    <p class="hint" id="tplHint">Template baru ditambahkan ke kategori yang sedang dipilih.</p>
  </div>
</main>

<div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Same project, same origin: this page is served from <ref>.supabase.co/storage
// and talks to <ref>.supabase.co/rest, so the browser sees one origin and no
// CORS preflight is needed. The anon key is public by design; Row Level
// Security still decides what it may touch (categories + templates only).
// ---------------------------------------------------------------------------
const SUPABASE_URL = "https://zympqqmrygldagpazvse.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bXBxcW1yeWdsZGFncGF6dnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODQzMTYsImV4cCI6MjEwMDU2MDMxNn0.C5vZC_6_6TqTB4cqGtTBaBMahIY6UQ2ZNSLSEk9I09o";

const CAT_SELECT =
  "id,name,display_order,templates(id,content,display_order)";

let cats = [];
let selectedId = null;
let editingId = null;   // template id being edited, null = creating
let catMode = null;     // "add" | "rename" | null

const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------------ transport
async function api(path, options = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      apikey: ANON_KEY,
      Authorization: "Bearer " + ANON_KEY,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (_) { /* non-JSON body */ } }
  if (!res.ok) {
    throw new Error((data && data.message) || ("HTTP " + res.status));
  }
  return data;
}

function busy(on) { $("busy").style.width = on ? "100%" : "0"; }

let toastTimer = null;
function toast(message, isError) {
  const el = $("toast");
  el.textContent = message;
  el.classList.toggle("err", !!isError);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

/** Runs a mutation, then reloads from the server so the view never lies. */
async function mutate(successText, run) {
  busy(true);
  try {
    await run();
    await load();
    toast(successText);
    return true;
  } catch (err) {
    toast("Gagal: " + err.message, true);
    return false;
  } finally {
    busy(false);
  }
}

// -------------------------------------------------------------------- loading
async function load() {
  busy(true);
  try {
    cats = (await api("/rest/v1/categories?select=" + CAT_SELECT +
      "&order=display_order.asc,id.asc")) || [];
    cats.forEach(c => (c.templates || []).sort(
      (a, b) => (a.display_order - b.display_order) || (a.id - b.id)));
    if (!cats.some(c => c.id === selectedId)) {
      selectedId = cats.length ? cats[0].id : null;
    }
    render();
  } catch (err) {
    toast("Gagal memuat: " + err.message, true);
  } finally {
    busy(false);
  }
}

const current = () => cats.find(c => c.id === selectedId) || null;

// ------------------------------------------------------------------- rendering
function render() {
  renderChips();
  renderTemplates();
  const has = !!current();
  $("btnRename").disabled = !has;
  $("btnDeleteCat").disabled = !has;
  $("btnAddCat").disabled = catMode === "add";
  if (catMode !== "rename") $("catName").value = "";
}

function renderChips() {
  const wrap = $("chips");
  wrap.textContent = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c.id === selectedId ? " on" : "");
    b.textContent = c.name + " • " + (c.templates ? c.templates.length : 0);
    b.onclick = () => { selectedId = c.id; closeCatForm(); render(); };
    wrap.appendChild(b);
  });
  if (!cats.length) {
    const s = document.createElement("span");
    s.className = "empty";
    s.textContent = "Belum ada kategori — tekan “+ Tambah Kategori”.";
    s.style.padding = "6px 0";
    wrap.appendChild(s);
  }
}

function renderTemplates() {
  const list = $("tplList");
  list.textContent = "";
  const cat = current();

  if (!cat) {
    $("tplTitle").textContent = "Template";
    $("formTpl").style.display = "none";
    list.innerHTML = '<div class="empty">Pilih atau buat kategori dulu.</div>';
    return;
  }

  $("tplTitle").textContent = "Template — " + cat.name;
  $("formTpl").style.display = "";

  if (!cat.templates.length) {
    list.innerHTML = '<div class="empty">Belum ada template di kategori ini.</div>';
    return;
  }

  cat.templates.forEach(t => {
    const card = document.createElement("div");
    card.className = "tpl";

    const p = document.createElement("p");
    p.className = "txt";
    p.textContent = t.content;

    const acts = document.createElement("div");
    acts.className = "acts";

    const edit = document.createElement("button");
    edit.className = "e";
    edit.textContent = "Ubah";
    edit.onclick = () => {
      editingId = t.id;
      $("tplText").value = t.content;
      $("btnSaveTpl").textContent = "Simpan Perubahan";
      $("btnCancelEdit").style.display = "";
      $("tplText").focus();
      $("tplText").scrollIntoView({ behavior: "smooth", block: "center" });
    };

    const del = document.createElement("button");
    del.className = "d";
    del.textContent = "Hapus";
    del.onclick = () => {
      if (!confirm("Hapus template ini dari Supabase?")) return;
      mutate("Template terhapus ✓",
        () => api("/rest/v1/templates?id=eq." + t.id, { method: "DELETE" }));
    };

    acts.appendChild(edit);
    acts.appendChild(del);
    card.appendChild(p);
    card.appendChild(acts);
    list.appendChild(card);
  });
}

function closeCatForm() {
  catMode = null;
  $("formCat").style.display = "none";
  $("catName").value = "";
  render();
}

// ------------------------------------------------------------------ mutations
function nextOrder(list) {
  return list.reduce((max, x) => Math.max(max, x.display_order || 0), 0) + 1;
}

$("btnAddCat").onclick = () => {
  catMode = "add";
  $("formCat").style.display = "flex";
  $("catName").placeholder = "Nama kategori baru";
  $("catName").value = "";
  $("catName").focus();
  render();
};

$("btnRename").onclick = () => {
  const cat = current();
  if (!cat) return;
  catMode = "rename";
  $("formCat").style.display = "flex";
  $("catName").placeholder = "Nama kategori";
  $("catName").value = cat.name;
  $("catName").focus();
  $("catName").select();
};

$("catCancel").onclick = closeCatForm;

$("formCat").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("catName").value.trim();
  if (!name) { toast("Nama tidak boleh kosong", true); return; }

  if (catMode === "rename") {
    const cat = current();
    if (!cat) return;
    const ok = await mutate("Kategori diubah ✓", () =>
      api("/rest/v1/categories?id=eq." + cat.id, {
        method: "PATCH", body: JSON.stringify({ name })
      }));
    if (ok) closeCatForm();
  } else {
    const ok = await mutate("Kategori ditambah ✓", () =>
      api("/rest/v1/categories", {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({ name, display_order: nextOrder(cats) })
      }));
    if (ok) closeCatForm();
  }
};

$("btnDeleteCat").onclick = () => {
  const cat = current();
  if (!cat) return;
  const n = cat.templates ? cat.templates.length : 0;
  const msg = n
    ? "Hapus kategori “" + cat.name + "” beserta " + n + " template di dalamnya?"
    : "Hapus kategori “" + cat.name + "”?";
  if (!confirm(msg)) return;
  selectedId = null;
  mutate("Kategori terhapus ✓", () =>
    api("/rest/v1/categories?id=eq." + cat.id, { method: "DELETE" }));
};

$("formTpl").onsubmit = async (e) => {
  e.preventDefault();
  const content = $("tplText").value.trim();
  if (!content) { toast("Teks template tidak boleh kosong", true); return; }
  const cat = current();
  if (!cat) { toast("Pilih kategori dulu", true); return; }

  if (editingId) {
    const ok = await mutate("Template diubah ✓", () =>
      api("/rest/v1/templates?id=eq." + editingId, {
        method: "PATCH", body: JSON.stringify({ content })
      }));
    if (ok) resetTemplateForm();
  } else {
    const ok = await mutate("Template ditambah ✓", () =>
      api("/rest/v1/templates", {
        method: "POST",
        body: JSON.stringify({
          category_id: cat.id,
          content,
          display_order: nextOrder(cat.templates || [])
        })
      }));
    if (ok) { $("tplText").value = ""; }
  }
};

$("btnCancelEdit").onclick = resetTemplateForm;

function resetTemplateForm() {
  editingId = null;
  $("tplText").value = "";
  $("btnSaveTpl").textContent = "Simpan Template";
  $("btnCancelEdit").style.display = "none";
}

load();
</script>
</body>
</html>
